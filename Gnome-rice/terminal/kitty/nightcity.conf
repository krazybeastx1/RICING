# NIGHT CITY — kitty profile
# Usage: include ~/.config/kitty/nightcity.conf from kitty.conf
#   include nightcity.conf

font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
font_size        11.5
adjust_line_height 105%
disable_ligatures never

foreground            #E8EAF0
background            #08090D
selection_foreground  #E8EAF0
selection_background  #57202F
cursor                #FF1744
cursor_text_color     #08090D
cursor_shape          beam
cursor_blink_interval 0.6
url_color             #00E5FF

active_border_color    #FF1744
inactive_border_color  #343B49
active_tab_background  #171B24
active_tab_foreground  #E8EAF0
inactive_tab_background #101218
inactive_tab_foreground #9299A8
tab_bar_background     #08090D
tab_bar_margin_color   #08090D

background_opacity 0.96
background_blur    24
window_padding_width 12
window_margin_width 0
confirm_os_window_close 0

# NIGHT CITY ANSI
color0  #101218
color8  #343B49
color1  #FF1744
color9  #FF3D81
color2  #A6E3A1
color10 #B9EFB4
color3  #F9E2AF
color11 #FFE9B8
color4  #89B4FA
color12 #A8C8FF
color5  #CBA6F7
color13 #DCC2FF
color6  #00E5FF
color14 #66F0FF
color7  #E8EAF0
color15 #FFFFFF

# A restrained glow on the active tab
active_tab_font_style   bold
inactive_tab_font_style normal

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd

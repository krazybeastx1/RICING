# NIGHT CITY — Unified Color Palette
# Source this file or reference values directly in terminal configurations.
# All colors use the official NIGHT CITY palette.

# Core backgrounds
NIGHTCITY_BG_MAIN="#08090D"
NIGHTCITY_BG_SECONDARY="#101218"
NIGHTCITY_BG_ELEVATED="#171B24"
NIGHTCITY_BG_BORDER="#343B49"

# Core foregrounds
NIGHTCITY_FG_PRIMARY="#E8EAF0"
NIGHTCITY_FG_MUTED="#9299A8"

# Accent colors
NIGHTCITY_RED_PRIMARY="#FF1744"
NIGHTCITY_RED_ACTIVE="#E60035"
NIGHTCITY_RED_DARK="#8C102B"
NIGHTCITY_CYAN="#00E5FF"
NIGHTCITY_PURPLE="#9B5CFF"

# Semantic aliases for terminal use
NIGHTCITY_CURSOR="$NIGHTCITY_RED_PRIMARY"
NIGHTCITY_CURSOR_TEXT="$NIGHTCITY_BG_MAIN"
NIGHTCITY_SELECTION_BG="#57202F"
NIGHTCITY_SELECTION_FG="$NIGHTCITY_FG_PRIMARY"
NIGHTCITY_URL="$NIGHTCITY_CYAN"

# ANSI 16-color mapping (for terminal palettes)
# Standard colors
NIGHTCITY_ANSI_0="$NIGHTCITY_BG_SECONDARY"
NIGHTCITY_ANSI_1="$NIGHTCITY_RED_PRIMARY"
NIGHTCITY_ANSI_2="#A6E3A1"   # Green
NIGHTCITY_ANSI_3="#F9E2AF"   # Yellow
NIGHTCITY_ANSI_4="#89B4FA"   # Blue
NIGHTCITY_ANSI_5="#CBA6F7"   # Magenta
NIGHTCITY_ANSI_6="$NIGHTCITY_CYAN"
NIGHTCITY_ANSI_7="$NIGHTCITY_FG_PRIMARY"

# Bright colors
NIGHTCITY_ANSI_8="$NIGHTCITY_BG_BORDER"
NIGHTCITY_ANSI_9="#FF3D81"   # Bright red
NIGHTCITY_ANSI_10="#B9EFB4"  # Bright green
NIGHTCITY_ANSI_11="#FFE9B8"  # Bright yellow
NIGHTCITY_ANSI_12="#A8C8FF"  # Bright blue
NIGHTCITY_ANSI_13="#DCC2FF"  # Bright magenta
NIGHTCITY_ANSI_14="#66F0FF"  # Bright cyan
NIGHTCITY_ANSI_15="#FFFFFF"  # Bright white

# Font configuration
NIGHTCITY_FONT_FAMILY="JetBrains Mono"
NIGHTCITY_FONT_SIZE="11.5"
NIGHTCITY_FONT_LINE_HEIGHT="105%"

# Opacity (for terminals that support it)
NIGHTCITY_OPACITY="0.96"
NIGHTCITY_BLUR="24"

# Window padding
NIGHTCITY_PADDING_X="12"
NIGHTCITY_PADDING_Y="12"

# Export for shell scripts
export NIGHTCITY_BG_MAIN NIGHTCITY_BG_SECONDARY NIGHTCITY_BG_ELEVATED NIGHTCITY_BG_BORDER
export NIGHTCITY_FG_PRIMARY NIGHTCITY_FG_MUTED
export NIGHTCITY_RED_PRIMARY NIGHTCITY_RED_ACTIVE NIGHTCITY_RED_DARK NIGHTCITY_CYAN NIGHTCITY_PURPLE
export NIGHTCITY_CURSOR NIGHTCITY_CURSOR_TEXT NIGHTCITY_SELECTION_BG NIGHTCITY_SELECTION_FG NIGHTCITY_URL
export NIGHTCITY_ANSI_0 NIGHTCITY_ANSI_1 NIGHTCITY_ANSI_2 NIGHTCITY_ANSI_3 NIGHTCITY_ANSI_4 NIGHTCITY_ANSI_5 NIGHTCITY_ANSI_6 NIGHTCITY_ANSI_7
export NIGHTCITY_ANSI_8 NIGHTCITY_ANSI_9 NIGHTCITY_ANSI_10 NIGHTCITY_ANSI_11 NIGHTCITY_ANSI_12 NIGHTCITY_ANSI_13 NIGHTCITY_ANSI_14 NIGHTCITY_ANSI_15
export NIGHTCITY_FONT_FAMILY NIGHTCITY_FONT_SIZE NIGHTCITY_FONT_LINE_HEIGHT
export NIGHTCITY_OPACITY NIGHTCITY_BLUR NIGHTCITY_PADDING_X NIGHTCITY_PADDING_Y